# YZM536 Air Quality — TR resmi + dini tatil veri seti (2024-2025)
#
# Amaç: dim_time.is_holiday seed'i için statik tatil listesi
#   (sprint-05 B1 kararı — runtime API çağrısı yok, secret yüzeyi sıfır).
#   `infra/postgres/seed_dim_time.py` bu dosyayı pydantic `HolidayEntry`
#   modeliyle parse eder; eşleşen tarihin 24 saatlik satırı is_holiday=true.
#
# Kapsam: yalnız tam gün tatiller. Yarım gün arifeler (28 Ekim öğleden
#   sonra, dini bayram arife günleri) NOT olarak işaretli ama is_holiday
#   amacıyla tam gün kabul edilir — saatlik granülerite tam gün bayrak
#   tutar (hava kalitesi trafik/ısınma analizi için arife günü de düşük
#   aktivite gösterir; yarım gün ayrımı dim_time şemasında kolon yok).
#
# KAYNAKLAR:
#   - Resmi (official) tatiller: 2429 sayılı "Ulusal Bayram ve Genel
#     Tatiller Hakkında Kanun" — sabit tarihli, her yıl değişmez.
#   - Dini (religious) bayramlar: Diyanet İşleri Başkanlığı resmi
#     "Dini Günler / Dini Bayramlar" takvimi (diyanet.gov.tr). Ramazan ve
#     Kurban bayramı arife + bayram günleri hicri takvime göre belirlenir;
#     2024-2025 tarihleri Diyanet'in ilan ettiği takvimden alınmıştır.
#
# date: YYYY-MM-DD · name: tatil adı (TR) · type: official | religious

